<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <h1>IT Seminar Registration</h1>

        <form id="registrationForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" aria-describedby="fullNameError">
                <small id="fullNameError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="studentNumber">Student Number</label>
                <input type="text" id="studentNumber" aria-describedby="studentNumberError">
                <small id="studentNumberError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" aria-describedby="emailError">
                <small id="emailError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="tel" id="mobileNumber" aria-describedby="mobileNumberError">
                <small id="mobileNumberError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" aria-describedby="passwordError">
                <small id="passwordError" class="error"></small>
                <small id="passwordFeedback" class="feedback"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" aria-describedby="confirmPasswordError">
                <small id="confirmPasswordError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" aria-describedby="courseError">
                    <option value="">Select your course</option>
                    <option value="BSIT">BSIT</option>
                    <option value="BSCS">BSCS</option>
                </select>
                <small id="courseError" class="error"></small>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" aria-describedby="termsError">
                <label for="terms">I agree to the terms and conditions.</label>
            </div>

            <small id="termsError" class="error"></small>

            <div class="buttons">
                <button type="submit" id="registerBtn">Register</button>
                <button type="reset" id="resetBtn">Reset</button>
            </div>

        </form>

        <div id="successMessage" class="success"></div>

        <section id="registrationSummary" class="summary" hidden>
            <h2>Registration Summary</h2>

            <p><strong>Full Name:</strong> <span id="summaryName"></span></p>
            <p><strong>Student Number:</strong> <span id="summaryStudentNumber"></span></p>
            <p><strong>Email:</strong> <span id="summaryEmail"></span></p>
            <p><strong>Mobile Number:</strong> <span id="summaryMobileNumber"></span></p>
            <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
